name: CI

# Bu depoda 21 Eylul 2026'ya kadar hic is akisi yoktu. Iki sey
# dogrulanmiyordu: iki sablon projenin acilip acilmadigi, ve README'nin en
# merkezi iddiasi -- "his olculdu, tahmin edilmedi". oyuncu.gd'deki bir
# sabiti degistiren commit, README'deki 58/35 pikseli sessizce yanlisa
# dusurebilirdi.
#
# Dort is var ve hicbiri UYDURULMUS bir komut calistirmiyor:
#   testler     -> Python kopyasinin davranis testleri (pytest).
#   egri        -> arac/zipla-egrisi.py'nin okudugu ayni sabitlerle simulasyon,
#                  sonuc README'nin YAZDIGI sayilarla karsilastiriliyor.
#   projeler    -> oyun depolarindakiyle ayni sabit Godot surumu: iki proje
#                  ice aktariliyor, bir kare calisiyor; sonra zipla hissi
#                  GERCEK motorda olculup Python kopyasiyla karsilastiriliyor
#                  ve oyuncunun ornek seviyeden dusemedigi kosturularak
#                  gosteriliyor.
#   referanslar -> godot-refcheck ile kirik kaynak referansi taramasi.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Surum SABIT tutuluyor: "latest", motor guncellenince bu depodan
  # bagimsiz bir kirmizi uretirdi. Dort oyun deposuyla ayni surum.
  GODOT_SURUM: 4.7.2-stable
  # Indirilen zip calistirilmadan once bu ozetle karsilastiriliyor. Deger,
  # godotengine/godot 4.7.2-stable surumunun SHA512-SUMS.txt dosyasindaki
  # Godot_v4.7.2-stable_linux.x86_64.zip satirindan. Surum degisirse bu da.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  testler:
    name: Denetleyici davranisi
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 7 sn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      # `dogrula.py` README'deki iki basligin dogrulugunu koruyor; bu suite
      # bir seviye asagida, hangi davranisin bozuldugunu soyluyor: kojot
      # penceresi, tampon penceresi, kesmenin tepeyi dusurmesi, zemin.
      - run: python -m pytest testler -q

  egri:
    name: Zipla egrileri README ile ayni mi
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 8 sn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Bagimlilik yok: betikler yalnizca standart kutuphane kullaniyor.
      - name: Egriyi yazdir
        run: python3 arac/zipla-egrisi.py

      - name: README ile karsilastir
        run: python3 arac/dogrula.py

  projeler:
    name: Iki proje de aciliyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 16 sn
    steps:
      - uses: actions/checkout@v7

      - name: Godot ${{ env.GODOT_SURUM }} indir
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          godot --version

      # Godot betik hatasinda da 0 ile cikabiliyor; bu yuzden cikis kodu
      # yetmiyor, ciktinin kendisi taraniyor. Ice aktarma ayri adim: taze
      # checkout'ta .godot yok ve eksik onbellek, gercek bir hatayla
      # karisacak "Identifier not declared" gurultusu uretiyor.
      - name: Projeleri ice aktar ve bir kare calistir
        run: |
          set -euo pipefail
          for proje in ustten-gorunum yandan-gorunum; do
            echo "::group::$proje"
            godot --headless --path "$proje" --import 2>&1 | tee "/tmp/$proje-import.log"
            godot --headless --path "$proje" --quit   2>&1 | tee "/tmp/$proje-run.log"
            echo "::endgroup::"
            if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open file' \
                 "/tmp/$proje-import.log" "/tmp/$proje-run.log"; then
              echo "$proje: betik veya kaynak hatasi var"
              grep -nE 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open file' \
                "/tmp/$proje-import.log" "/tmp/$proje-run.log"
              exit 1
            fi
            echo "$proje: temiz"
          done

      # README'deki 58/35 piksel, oyuncu.gd'nin Python'a tasinmis kopyasindan
      # geliyor. Kopya ancak asliyla karsilastirildigi surece guvenilir:
      # oyuncu.gd'de satirlarin sirasi degisirse Python testleri yesil kalir.
      # Bu adim ayni senaryolari gercek Godot'ta, gercek move_and_slide ve
      # gercek Input eylemleriyle kosturup iki sonucu yan yana koyuyor.
      # --fixed-fps 60: gercek zamani beklemeden, projenin fizik adimiyla.
      - name: Zipla hissini motorda olc, Python kopyasiyla karsilastir
        run: |
          set -euo pipefail
          godot --headless --fixed-fps 60 --path yandan-gorunum \
            --script "$PWD/arac/motor-olcumu.gd" 2>&1 | tee /tmp/motor.log
          python3 arac/motor-karsilastir.py /tmp/motor.log

      # Sablonu ilk acan kisi once saga sola kosar; bosluga dusup sonsuza
      # kadar dusen bir karakter ilk bes dakikayi bitirir.
      - name: Oyuncu ornek seviyenin icinde kaliyor mu
        run: |
          set -euo pipefail
          for proje in ustten-gorunum yandan-gorunum; do
            godot --headless --fixed-fps 60 --path "$proje" \
              --script "$PWD/arac/seviye-sinirlari.gd" 2>&1 | tee "/tmp/$proje-seviye.log"
            grep -q '^SEVIYE_TAMAM' "/tmp/$proje-seviye.log"
          done

  referanslar:
    name: Sablonlarin kaynak referanslari saglam mi
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 34 sn
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Bir sablonun en pahali kusuru kirik bir kaynak referansidir: projeyi
      # klonlayan kisi ilk saatini olmayan bir .tscn'i ararken harciyor.
      # Bu kontrol ayni hesaptaki godot-refcheck ile yapiliyor -- motoru
      # indirmeden, iki projeyi de tarayarak.
      - name: godot-refcheck (iki proje birden)
        uses: Furkiozknn/godot-refcheck@b083e3d2998ca0d5101289b106c76794c6de866d  # v0.2.0 + the clean-project fix
        with:
          path: .
          recursive: "true"
          fail-on: error
          sarif: refcheck.sarif

      - name: SARIF raporunu kod taramaya yukle
        if: always() && hashFiles('refcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck
